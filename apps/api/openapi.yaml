      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [imageIds]
              properties:
                imageIds: { type: array, items: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/products/{id}/images/{imageId}:

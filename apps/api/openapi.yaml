  /v1/admin/products/{id}/images:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      tags: [admin]
      security: [{ clerk: [] }]
      summary: Upload one image (JPEG/PNG/WebP, ≤10 MB, ≤40 MP; re-encoded, metadata stripped). Max 10 per product.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]

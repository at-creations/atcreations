        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [admin]
      security: [{ clerk: [] }]
      summary: Replace editable product fields (products:write). Requires the loaded `version`; 409 if the product changed meanwhile. Images are managed via the images endpoints.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '404': { $ref: '#/components/responses/Problem' }

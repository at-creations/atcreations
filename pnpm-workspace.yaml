packages:
  - apps/storefront
  - apps/admin
  - packages/*

# Supply-chain hardening: only allow lifecycle scripts for packages we vetted,
# and refuse versions published less than 3 days ago.
onlyBuiltDependencies:
  - esbuild
minimumReleaseAge: 4320

# Lets `pnpm deploy` (Dockerfiles) copy exactly the locked production dependencies instead of
# re-resolving them. Workspace packages without peer deps stay symlinked in development.
injectWorkspacePackages: true

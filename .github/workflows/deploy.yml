name: Deploy

# Builds immutable images, pushes them to GHCR with an SBOM and signed build
# provenance (GitHub artifact attestations, Sigstore), then rolls the production
# host forward. Verify an image with:
#   gh attestation verify oci://ghcr.io/<owner>/atcreations-api:sha-<commit> --owner <owner>
# The "production" environment should be configured with required reviewers in GitHub settings.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Only release tags, or a manual run from main, may build production images.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing of the provenance (Sigstore)
      attestations: write
    strategy:
      matrix:
        include:
          - { name: api, context: apps/api, file: apps/api/Dockerfile, target: api }
          - { name: imgworker, context: apps/api, file: apps/api/Dockerfile, target: imgworker }
          - { name: storefront, context: ., file: apps/storefront/Dockerfile }
          - { name: admin, context: ., file: apps/admin/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public build settings are set
        # They are compiled into the frontends' CSP; empty values would silently fall back to
        # localhost and break the storefront's API calls in production.
        if: matrix.name == 'storefront' || matrix.name == 'admin'
        env:
          APP: ${{ matrix.name }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_ASSET_BASE_URL: ${{ vars.PUBLIC_ASSET_BASE_URL }}
          CSP_IMG_ORIGINS: ${{ vars.CSP_IMG_ORIGINS }}
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CSP_CLERK_ORIGINS: ${{ vars.CSP_CLERK_ORIGINS }}
        run: |
          required="PUBLIC_API_URL CSP_IMG_ORIGINS"
          if [ "$APP" = storefront ]; then required="$required PUBLIC_ASSET_BASE_URL"; fi
          if [ "$APP" = admin ]; then required="$required PUBLIC_CLERK_PUBLISHABLE_KEY CSP_CLERK_ORIGINS"; fi
          missing=""
          for v in $required; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set the repository variables:$missing"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/atcreations-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public origins compiled into the frontends' CSP (repository variables, not secrets).
          build-args: |
            VERSION=${{ github.ref_name }}
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
            PUBLIC_ASSET_BASE_URL=${{ vars.PUBLIC_ASSET_BASE_URL }}
            CSP_IMG_ORIGINS=${{ vars.CSP_IMG_ORIGINS }}
            PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CSP_CLERK_ORIGINS=${{ vars.CSP_CLERK_ORIGINS }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Sign build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/atcreations-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin the server host key (no trust-on-first-use)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Roll out
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TAG: sha-${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/atcreations/deploy && ./scripts/deploy.sh '$TAG'"

name: Deploy

# Builds immutable images, pushes them to GHCR with an SBOM and signed build
# provenance (GitHub artifact attestations, Sigstore), then deploys them on Coolify.
# Verify an image with:
#   gh attestation verify oci://ghcr.io/<owner>/atcreations-api:sha-<commit> --owner <owner>
# Runs after CI passes on a push to main, on a release tag, or by hand from main.
# Setup: docs/deploy-coolify.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # The commit being shipped: CI's commit for workflow_run, otherwise the triggering commit.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Only a green CI run for a push to main in this repository (never a fork's PR), a release
    # tag, or a manual run from main may build production images; and only once deploys are
    # configured (docs/deploy-coolify.md), so pushes before that don't fail here.
    if: >-
      vars.COOLIFY_APP_UUID != '' && (
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || github.ref_type == 'tag'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing of the provenance (Sigstore)
      attestations: write
    strategy:
      matrix:
        include:
          - { name: api, context: apps/api, file: apps/api/Dockerfile, target: api }
          - { name: imgworker, context: apps/api, file: apps/api/Dockerfile, target: imgworker }
          - { name: storefront, context: ., file: apps/storefront/Dockerfile }
          - { name: admin, context: ., file: apps/admin/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Public build settings are set
        # They are compiled into the frontends' CSP; empty values would silently fall back to
        # localhost and break the storefront's API calls in production.
        if: matrix.name == 'storefront' || matrix.name == 'admin'
        env:
          APP: ${{ matrix.name }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_ASSET_BASE_URL: ${{ vars.PUBLIC_ASSET_BASE_URL }}
          CSP_IMG_ORIGINS: ${{ vars.CSP_IMG_ORIGINS }}
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CSP_CLERK_ORIGINS: ${{ vars.CSP_CLERK_ORIGINS }}
        run: |
          required="PUBLIC_API_URL CSP_IMG_ORIGINS"
          if [ "$APP" = storefront ]; then required="$required PUBLIC_ASSET_BASE_URL"; fi
          if [ "$APP" = admin ]; then required="$required PUBLIC_CLERK_PUBLISHABLE_KEY CSP_CLERK_ORIGINS"; fi
          missing=""
          for v in $required; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set the repository variables:$missing"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/atcreations-${{ matrix.name }}
          # Explicit sha tag: on workflow_run, github.sha is the default branch head, not CI's commit.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=sha-${{ env.SHA }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public origins compiled into the frontends' CSP (repository variables, not secrets).
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', env.SHA) }}
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
            PUBLIC_ASSET_BASE_URL=${{ vars.PUBLIC_ASSET_BASE_URL }}
            CSP_IMG_ORIGINS=${{ vars.CSP_IMG_ORIGINS }}
            PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CSP_CLERK_ORIGINS=${{ vars.CSP_CLERK_ORIGINS }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Sign build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/atcreations-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Points the Coolify resource (deploy/coolify/docker-compose.yml) at the new images and
  # deploys it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      APP: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      TAG: sha-${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Set the image tag
        run: |
          curl -fsS -X PATCH "$COOLIFY_URL/api/v1/applications/$APP/envs" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg tag "$TAG" '{key: "TAG", value: $tag}')" >/dev/null
      - name: Deploy and wait for the result
        run: |
          api() { curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/$1"; }
          id="$(api "deploy?uuid=$APP&force=false" | jq -r '.deployments[0].deployment_uuid')"
          [ -n "$id" ] && [ "$id" != null ] || { echo "::error::Coolify did not start a deployment"; exit 1; }
          echo "Deploying $TAG (Coolify deployment $id)"
          for _ in $(seq 1 90); do
            status="$(api "deployments/$id" | jq -r '.status')"
            case "$status" in
              finished) echo "Deployed $TAG"; exit 0 ;;
              failed|cancelled*) echo "::error::Coolify deployment $id $status; see its logs in Coolify"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Coolify deployment $id"; exit 1

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go mod verify
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Start MongoDB replica set, Redis and RustFS for integration tests
        run: |
          docker run -d --name redis -p 127.0.0.1:6379:6379 redis:8.2-alpine redis-server --requirepass ci-redis --save ""
          docker run -d --name rustfs -p 127.0.0.1:9000:9000 -e RUSTFS_ACCESS_KEY=atcreations-dev -e RUSTFS_SECRET_KEY=dev-rustfs-secret-key -e RUSTFS_REGION=us-east-1 rustfs/rustfs:1.0.3
          docker run -d --name mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }" && break
            sleep 2
          done
          until curl -fsS http://127.0.0.1:9000/health >/dev/null; do sleep 1; done
          docker run --rm --network host -v "$PWD/../../docker/dev/rustfs-init.sh:/rustfs-init.sh:ro"             -e S3_ENDPOINT=http://127.0.0.1:9000 -e BUCKET=atcreations-dev             -e AWS_ACCESS_KEY_ID=atcreations-dev -e AWS_SECRET_ACCESS_KEY=dev-rustfs-secret-key -e AWS_DEFAULT_REGION=us-east-1             --entrypoint /bin/sh amazon/aws-cli:2.38.4 /rustfs-init.sh
      - name: Integration tests
        # Every package: integration-tagged tests skip themselves when their service is missing.
        run: go test -race -tags integration ./...
        env:
          REDIS_TEST_URL: redis://:ci-redis@127.0.0.1:6379/15
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: apps/api
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    name: Storefront & Admin (SvelteKit)
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API types are in sync with openapi.yaml
        run: pnpm gen:api && git diff --exit-code packages/api-types
      - run: pnpm -r check
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
        env:
          # Build-time placeholders only; real values are injected at runtime.
          PUBLIC_SITE_URL: https://example.com
          PUBLIC_API_URL: https://api.example.com
          PUBLIC_ASSET_BASE_URL: https://cdn.example.com/site
          PUBLIC_STOREFRONT_URL: https://example.com
          PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder
      - run: pnpm audit --prod --audit-level high

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy (dependencies, secrets, IaC misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Code scanning needs a public repo (or GitHub Advanced Security): a private repo on
          # the Free plan gets the findings in the job log instead.
          format: ${{ github.event.repository.private && 'table' || 'sarif' }}
          output: ${{ github.event.repository.private && '' || 'trivy.sarif' }}
      # Findings appear in the repository's Security tab (what security-events: write is for).
      - name: Upload Trivy results
        if: always() && !github.event.repository.private && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [api, web]
    strategy:
      matrix:
        include:
          - { name: api, context: apps/api, file: apps/api/Dockerfile, target: api }
          - { name: imgworker, context: apps/api, file: apps/api/Dockerfile, target: imgworker }
          - { name: storefront, context: ., file: apps/storefront/Dockerfile }
          - { name: admin, context: ., file: apps/admin/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          push: false
          load: true
          tags: atcreations-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atcreations-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

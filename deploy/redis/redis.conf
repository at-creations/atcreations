# Redis for the AT Creations API: response cache, rate-limit counters,
# identity cache and locks. Everything is ephemeral, so persistence is off.
bind 0.0.0.0
protected-mode yes
port 6379

# No snapshots or AOF: nothing here needs to survive a restart.
save ""
appendonly no
dir /tmp

# Bounded memory; evict only keys that carry a TTL (cache entries, limits,
# locks) so cache-version counters are never evicted.
maxmemory 128mb
maxmemory-policy volatile-lru

# Close idle clients and detect dead peers.
timeout 300
tcp-keepalive 60

loglevel notice

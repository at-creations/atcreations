# Redis for the AT Creations API: response cache, rate-limit counters,
# identity cache, locks and analytics counters (flushed to MongoDB every 30 s).
# Everything is short-lived, so persistence is off: a restart loses at most the
# last ~30 s of page-view counts.
bind 0.0.0.0
protected-mode yes
port 6379

# No snapshots or AOF: nothing here needs to survive a restart.
save ""
appendonly no
dir /tmp

# Bounded memory; evict only keys that carry a TTL (cache entries, limits,
# locks), so cache-version counters and unflushed analytics counters are never
# evicted. Keep mem_limit in deploy/docker-compose.yml above this.
maxmemory 256mb
maxmemory-policy volatile-lru

# Close idle clients and detect dead peers.
timeout 300
tcp-keepalive 60

loglevel notice

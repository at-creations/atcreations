# Production stack for a single host: Caddy (TLS) → storefront/admin/api → MongoDB.
# Usage: see deploy/README.md. All secrets come from deploy/.env and deploy/secrets/ (never committed).
name: atcreations

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  pids_limit: 256 # stops a fork bomb or thread leak from exhausting the host
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    <<: *hardening
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    cap_add: ["NET_BIND_SERVICE"]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: ["/tmp"]
    cpus: 1.0
    networks:
      edge: { ipv4_address: 172.30.0.10 }
    depends_on:
      api: { condition: service_healthy }
      storefront: { condition: service_healthy }
      admin: { condition: service_healthy }

  api:
    <<: *hardening
    image: ${REGISTRY:-ghcr.io/atcreations}/atcreations-api:${TAG:-latest}
    build: { context: ../apps/api, target: api }
    env_file: [./env/api.env]
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      # Only Caddy and the storefront (which forwards visitor IPs for SSR calls)
      # may set X-Forwarded-For. Never trust the whole subnet: it includes the
      # Docker gateway, which fronts IPv6 visitors when the userland proxy is used.
      TRUSTED_PROXIES: 172.30.0.10/32,172.30.0.11/32
      IMAGE_WORKER_ADDR: imgworker:9090
      GOMEMLIMIT: 400MiB
    tmpfs: ["/tmp:size=64m"] # multipart uploads spill here
    mem_limit: 512m
    cpus: 1.5
    networks: [edge, data]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Image worker: decodes and re-encodes uploads (WebP). Object storage only: no database,
  # no published ports, reachable only by the API with the shared token.
  imgworker:
    <<: *hardening
    image: ${REGISTRY:-ghcr.io/atcreations}/atcreations-imgworker:${TAG:-latest}
    build: { context: ../apps/api, target: imgworker }
    env_file: [./env/imgworker.env]
    environment:
      APP_ENV: production
      WORKER_ADDR: ":9090"
      WORKER_CONCURRENCY: "2"
      GOMEMLIMIT: 768MiB
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 1g
    cpus: 2.0 # image decoding (WORKER_CONCURRENCY) is CPU-bound
    networks: [edge]

  storefront:
    <<: *hardening
    image: ${REGISTRY:-ghcr.io/atcreations}/atcreations-storefront:${TAG:-latest}
    build: { context: .., dockerfile: apps/storefront/Dockerfile }
    env_file: [./env/storefront.env]
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3000"
      ORIGIN: https://${STOREFRONT_DOMAIN}
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
    tmpfs: ["/tmp"]
    mem_limit: 384m
    cpus: 1.0
    networks:
      edge: { ipv4_address: 172.30.0.11 }
    # Any answer below 500 means the server is up and rendering (SvelteKit in distroless: no shell).
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on: [api]

  admin:
    <<: *hardening
    image: ${REGISTRY:-ghcr.io/atcreations}/atcreations-admin:${TAG:-latest}
    build: { context: .., dockerfile: apps/admin/Dockerfile }
    env_file: [./env/admin.env]
    environment:
      PORT: "3000"
      ORIGIN: https://${ADMIN_DOMAIN}
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
    tmpfs: ["/tmp"]
    mem_limit: 384m
    cpus: 0.5
    networks: [edge]
    # Any answer below 500 means the server is up and rendering (SvelteKit in distroless: no shell).
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  redis:
    <<: *hardening
    image: redis:8.2-alpine@sha256:d1389b3f3f981460b9b0918c4d7390c6e9decb8c69b9f09a02e1b6fd7554ade7
    # Needed only to write the ACL file and drop to the redis user at start.
    cap_add: ["CHOWN", "SETUID", "SETGID"]
    entrypoint: ["/bin/sh", "/usr/local/bin/atc-entrypoint.sh"]
    secrets: [redis_password]
    volumes:
      - ./redis/entrypoint.sh:/usr/local/bin/atc-entrypoint.sh:ro
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --no-auth-warning --user atcreations ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 320m
    cpus: 0.5
    # No published ports: reachable only from the internal data network.
    networks: [data]

  mongo:
    image: mongo:8.0@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    # The keyfile is required for auth on a replica set; it must be owned by
    # the mongodb user with 0400 permissions, so it is installed at start.
    entrypoint:
      - bash
      - -c
      - |
        install -m 0400 -o 999 -g 999 /run/secrets/mongo_keyfile /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/configdb/keyfile --wiredTigerCacheSizeGB 0.5
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_APP_DB: atcreations
    secrets: [mongo_keyfile, mongo_root_password, mongo_app_password]
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
      - ../backups:/backups
    healthcheck:
      # Initiates the single-node replica set on first boot, then reports health.
      test:
        - CMD-SHELL
        # The password is read inside mongosh, never passed on a command line (visible in ps).
        - >-
          mongosh --quiet --nodb --eval
          "const pw = require('fs').readFileSync('/run/secrets/mongo_root_password', 'utf8').trim();
          db = new Mongo('mongodb://root:' + encodeURIComponent(pw) + '@127.0.0.1:27017/?authSource=admin&directConnection=true').getDB('admin');
          try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # No published ports: MongoDB is reachable only from the internal data network.
    networks: [data]

networks:
  edge:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  data:
    internal: true # no route to the internet

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
  mongo_config:

secrets:
  mongo_keyfile:
    file: ./secrets/mongo_keyfile
  mongo_root_password:
    file: ./secrets/mongo_root_password
  mongo_app_password:
    file: ./secrets/mongo_app_password
  redis_password:
    file: ./secrets/redis_password

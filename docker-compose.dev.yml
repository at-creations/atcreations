# Local development dependencies only (the apps run on the host with hot reload).
# MongoDB runs as a single-node replica set so transactions work like production.
# It is bound to 127.0.0.1 only and has no auth — never expose this file's setup.
name: atcreations-dev

services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo_dev:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"]
      interval: 5s
      retries: 20

volumes:
  mongo_dev:

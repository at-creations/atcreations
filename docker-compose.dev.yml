# Local development stack: MongoDB + Redis + RustFS (S3) + API + storefront + admin, with live reload.
#
#   pnpm dev:stack            # = docker compose -f docker-compose.dev.yml up --build --watch
#   pnpm dev:stack:down       # stop (add -v to also wipe the dev database)
#
# Only MongoDB, to run the apps on the host instead:
#   docker compose -f docker-compose.dev.yml up -d mongo
#
# Every port is bound to 127.0.0.1. MongoDB has no auth here — this file is
# for local development only; production uses deploy/docker-compose.yml.
#
# Host ports can be changed with API_PORT, STOREFRONT_PORT, ADMIN_PORT,
# MONGO_PORT, REDIS_PORT, S3_PORT, S3_CONSOLE_PORT (e.g. in a root .env file) if something else already uses them.
#
# Public hostnames via Cloudflare Tunnel (optional):
#   bash docker/dev/cloudflared/setup.sh   # once: tunnel, DNS routes, config, .env
#   pnpm dev:stack:tunnel                  # = up with --profile tunnel
# setup.sh writes DEV_STOREFRONT_URL / DEV_ADMIN_URL / DEV_API_URL /
# DEV_TUNNEL_HOSTS to the root .env; without them everything stays on localhost.
name: atcreations-dev

x-web-watch-ignore: &web-watch-ignore
  - node_modules/
  - .svelte-kit/
  - build/
  - src/lib/paraglide/
  - .env

services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    volumes: [mongo_dev:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8.2-alpine
    # Dev only: simple password, no persistence, bound to 127.0.0.1.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "dev-redis-password", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "dev-redis-password", "ping"]
      interval: 5s
      retries: 20

  # S3-compatible object storage standing in for Cloudflare R2 in development.
  # Console: http://localhost:9001/rustfs/console/ (atcreations-dev / dev-rustfs-secret-key).
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://localhost:${S3_CONSOLE_PORT:-9001}
      RUSTFS_REGION: us-east-1
      RUSTFS_ACCESS_KEY: atcreations-dev
      RUSTFS_SECRET_KEY: dev-rustfs-secret-key
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes: [rustfs_dev:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      retries: 20

  # One-shot: create the bucket and its public-read policy for images.
  rustfs-init:
    image: amazon/aws-cli:2.38.4
    entrypoint: ["/bin/sh", "/rustfs-init.sh"]
    environment:
      S3_ENDPOINT: http://rustfs:9000
      BUCKET: atcreations-dev
      AWS_ACCESS_KEY_ID: atcreations-dev
      AWS_SECRET_ACCESS_KEY: dev-rustfs-secret-key
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/dev/rustfs-init.sh:/rustfs-init.sh:ro
      - ./docker/dev/site-assets:/site-assets:ro # marketing images (fetch-site-assets.sh)
    depends_on:
      rustfs: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ./apps/api }
    env_file:
      - path: ./docker/dev/api.env
      - path: ./apps/api/.env # optional: real dev keys (Clerk, R2, SendGrid)
        required: false
    environment:
      # Container-specific values always win over the env files.
      HTTP_ADDR: ":8080"
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://:dev-redis-password@redis:6379/0
      # Localhost origins always work; tunnel origins are added when configured
      # (empty list entries are ignored by the API).
      CORS_PUBLIC_ORIGINS: http://localhost:${STOREFRONT_PORT:-5173},${DEV_STOREFRONT_URL:-}
      CORS_ADMIN_ORIGINS: http://localhost:${ADMIN_PORT:-5174},${DEV_ADMIN_URL:-}
      CLERK_AUTHORIZED_PARTIES: http://localhost:${ADMIN_PORT:-5174},${DEV_ADMIN_URL:-}
      CLERK_INVITE_REDIRECT_URL: ${DEV_ADMIN_URL:-http://localhost:${ADMIN_PORT:-5174}}/sign-up
      STOREFRONT_URL: ${DEV_STOREFRONT_URL:-http://localhost:${STOREFRONT_PORT:-5173}}
      # Browsers load images from here: RustFS on localhost, or the read-only
      # media proxy when the tunnel is set up (DEV_MEDIA_ORIGIN).
      CDN_BASE_URL: ${DEV_MEDIA_ORIGIN:-http://localhost:${S3_PORT:-9000}}/atcreations-dev
      # Docker networks only: cloudflared and the storefront set X-Forwarded-For.
      TRUSTED_PROXIES: 172.16.0.0/12
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs-init: { condition: service_completed_successfully }
    develop:
      watch:
        # Go builds in seconds: rebuild and restart the container on change.
        - action: rebuild
          path: ./apps/api
          ignore: [bin/, .env, openapi.yaml]

  storefront:
    build:
      context: .
      dockerfile: docker/dev/web.Dockerfile
      args: { APP: storefront }
    environment:
      PORT: "5173"
      PUBLIC_SITE_URL: ${DEV_STOREFRONT_URL:-http://localhost:${STOREFRONT_PORT:-5173}}
      PUBLIC_API_URL: ${DEV_API_URL:-http://localhost:${API_PORT:-8080}}
      API_INTERNAL_URL: http://api:8080
      VITE_ALLOWED_HOSTS: ${DEV_TUNNEL_HOSTS:-}
      # Marketing images from the local bucket (docker/dev/fetch-site-assets.sh).
      PUBLIC_ASSET_BASE_URL: ${DEV_MEDIA_ORIGIN:-http://localhost:${S3_PORT:-9000}}/atcreations-dev/site
      CSP_IMG_ORIGINS: ${DEV_MEDIA_ORIGIN:-http://localhost:${S3_PORT:-9000}} # product images
    ports: ["127.0.0.1:${STOREFRONT_PORT:-5173}:5173"]
    # Persist Vite's pre-bundled deps: rebuilding them on every container start
    # changes their URLs, and an open tab then mixes two Svelte runtimes and
    # fails to hydrate (blank page until a hard refresh).
    volumes: ["storefront_vite_cache:/repo/apps/storefront/node_modules/.vite"]
    depends_on:
      api: { condition: service_healthy }
    develop:
      watch:
        - action: sync
          path: ./apps/storefront
          target: /repo/apps/storefront
          ignore: *web-watch-ignore
        - action: sync
          path: ./packages/api-types/src
          target: /repo/packages/api-types/src
        - action: rebuild
          path: ./apps/storefront/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  admin:
    build:
      context: .
      dockerfile: docker/dev/web.Dockerfile
      args: { APP: admin }
    env_file:
      - path: ./docker/dev/admin.env # placeholder keys so the dev server starts
      - path: ./apps/admin/.env # your Clerk keys (pk_test_/sk_test_) — required to sign in
        required: false
    environment:
      # Container-specific values; Clerk keys deliberately come only from the
      # env files above (values here would override apps/admin/.env).
      PORT: "5173"
      PUBLIC_API_URL: ${DEV_API_URL:-http://localhost:${API_PORT:-8080}}
      PUBLIC_STOREFRONT_URL: ${DEV_STOREFRONT_URL:-http://localhost:${STOREFRONT_PORT:-5173}}
      VITE_ALLOWED_HOSTS: ${DEV_TUNNEL_HOSTS:-}
      CSP_IMG_ORIGINS: ${DEV_MEDIA_ORIGIN:-http://localhost:${S3_PORT:-9000}} # product images
    ports: ["127.0.0.1:${ADMIN_PORT:-5174}:5173"]
    # Persist Vite's pre-bundled deps: rebuilding them on every container start
    # changes their URLs, and an open tab then mixes two Svelte runtimes and
    # fails to hydrate (blank page until a hard refresh).
    volumes: ["admin_vite_cache:/repo/apps/admin/node_modules/.vite"]
    depends_on:
      api: { condition: service_healthy }
    develop:
      watch:
        - action: sync
          path: ./apps/admin
          target: /repo/apps/admin
          ignore: *web-watch-ignore
        - action: sync
          path: ./packages/api-types/src
          target: /repo/packages/api-types/src
        - action: rebuild
          path: ./apps/admin/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  # Public dev hostnames (profile "tunnel"). Only the tunnel credentials are
  # mounted; the account-level cert.pem from setup stays out of the container.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.1
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./docker/dev/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./docker/dev/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    depends_on: [storefront, admin, api, media]

  # Read-only HTTPS front for images when using the tunnel (see docker/dev/media/Caddyfile).
  media:
    profiles: [tunnel]
    image: caddy:2.10-alpine
    volumes: ["./docker/dev/media/Caddyfile:/etc/caddy/Caddyfile:ro"]
    read_only: true
    tmpfs: ["/data", "/config"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # The caddy binary carries the NET_BIND_SERVICE file capability; the
    # kernel refuses to exec it unless that capability is still available.
    cap_add: ["NET_BIND_SERVICE"]
    restart: unless-stopped
    depends_on:
      rustfs: { condition: service_healthy }

  # Optional database UI: docker compose -f docker-compose.dev.yml --profile tools up -d
  mongo-express:
    profiles: [tools]
    image: mongo-express:1.0.2
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      ME_CONFIG_BASICAUTH_USERNAME: dev
      ME_CONFIG_BASICAUTH_PASSWORD: dev
    ports: ["127.0.0.1:${MONGO_UI_PORT:-8088}:8081"]
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongo_dev:
  storefront_vite_cache:
  admin_vite_cache:
  rustfs_dev:
